onboarding = false
[theme]
name = "terminal"

auto_switch = false
[terminal]
# 現在のシェルを引き継ぐ（zsh）
default_shell = "zsh"
# macOS では login shell で PATH を正しく引き継ぐ
shell_mode = "auto"
# 新しいペインで現在のディレクトリを引き継ぐ
new_cwd = "follow"

[ui]
# マウス操作を有効化
mouse_capture = true
# ワークスペースを閉じる前に確認
confirm_close = true

show_agent_labels_on_pane_borders = true
# タブ作成時に名前を聞かず、自動生成名で即作成する
prompt_new_tab_name = false
# エージェントパネルの並び: "spaces"=スペースごとにグループ化 / "priority"=フラットな注意度順
agent_panel_sort = "priority"
[ui.toast]
# エージェントの完了を OS の通知サービスへ直接依頼する
delivery = "system"
delay_seconds = 1

[ui.sound]
# エージェントの状態変化をサウンドで通知（全エージェント一律で鳴らす）
enabled = true

[ui.sidebar.agents]
# 1 行目にタスク名（terminal title）、2 行目に場所。agent 名は全部 claude で無意味なので出さない
row_gap = 1
rows = [
  ["state_icon", "terminal_title_stripped"],
  ["workspace", "tab"],
]

[keys]
# tmux に合わせたキーバインド
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
detach = "prefix+d"                  # tmux: prefix+d
close_tab = "prefix+ampersand"       # tmux: prefix+&
rename_tab = "prefix+comma"          # tmux: prefix+,

# ペインフォーカス移動を vim ライクな hjkl へ（tmux の tmux.conf に合わせる）
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# prefix+alt+g で lazygit をペインで開く（prefix+l は hjkl の右移動に譲った。
# prefix+g=goto / prefix+shift+g=new_worktree は herdr 組み込みと衝突するため alt+g）
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"

# herdr-bar（Cmd+K 風のタブ/エージェント検索）。prefix+k は focus_pane_up に使っているので ctrl+alt+k
[[keys.command]]
key = "ctrl+alt+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[session]
# サーバー再起動後にエージェントセッションを自動復元
resume_agents_on_restore = true

[experimental]
# サーバー再起動後もペイン履歴を保持
pane_history = true
